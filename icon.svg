<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Зелёный фон -->
  <rect width="512" height="512" rx="100" fill="#2E7D32"/>
  
  <!-- Круглая рамка -->
  <rect width="512" height="512" rx="100" fill="none" stroke="#4CAF50" stroke-width="8"/>
  
  <!-- Рукоятка ключа -->
  <rect x="236" y="140" width="40" height="232" rx="8" fill="#FFFFFF"/>
  
  <!-- Головка ключа (кольцо) -->
  <circle cx="256" cy="120" r="36" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  
  <!-- Губки ключа -->
  <path d="M160 220 Q256 170 352 220" stroke="#FFFFFF" stroke-width="24" fill="none" stroke-linecap="round"/>
  
  <!-- Внутренняя часть губок -->
  <path d="M160 240 Q256 200 352 240" fill="#2E7D32"/>
  
  <!-- Яблоко (красное) -->
  <circle cx="256" cy="240" r="50" fill="#FF5252"/>
  
  <!-- Блик на яблоке -->
  <circle cx="270" cy="220" r="14" fill="white" opacity="0.7"/>
  
  <!-- Плодоножка -->
  <path d="M256 190 L248 170 L264 170 Z" fill="#1E8449"/>
  
  <!-- Листик -->
  <path d="M256 170 L236 154 L256 148 L276 154 Z" fill="#1E8449"/>
  
  <!-- Тень для объёма -->
  <ellipse cx="256" cy="300" rx="60" ry="8" fill="black" opacity="0.15"/>
</svg>
